<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BELOTA</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d3b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BELOTA" />
    <link rel="apple-touch-icon" href="/belota-icon.png" />

    <!-- Forcer le paysage via CSS sur mobile -->
    <style>
      html, body { margin: 0; padding: 0; background: #0d3b14; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/Belota.jsx"></script>

    <!-- Enregistrement Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
